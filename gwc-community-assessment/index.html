<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Rick Sebastian">
<meta name="theme-color" content="#0b4f6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GWC Assessment">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GWC Community Assessment</title>
<style>
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#eef3f6; --text:#0f2330; --muted:#526775;
  --line:#d5e0e7; --brand:#0b4f6c; --brand-2:#0f6f94; --brand-soft:#e1eff6; --on-brand:#ffffff;
  --tip-bg:#fff7e0; --tip-line:#e9c45a; --tip-text:#5a4300;
  --ok:#1d7a46; --ok-soft:#e1f3e8; --warn:#9a5b00; --warn-soft:#fdf0d9; --err:#b3261e; --err-soft:#fbe4e2;
  --new:#6a3fb5; --new-soft:#efe8fb;
  --radius:14px; --shadow:0 1px 2px rgba(15,35,48,.06),0 4px 14px rgba(15,35,48,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c161d; --surface:#13212b; --surface-2:#192a36; --text:#e6eef3; --muted:#9db1be;
    --line:#2a3d4a; --brand:#4fb3dc; --brand-2:#79c7e7; --brand-soft:#173444; --on-brand:#06212d;
    --tip-bg:#2b2410; --tip-line:#8a6d1c; --tip-text:#f2dc9a;
    --ok:#5fd08f; --ok-soft:#14321f; --warn:#f0b35a; --warn-soft:#33260f; --err:#ff8a80; --err-soft:#3a1715;
    --new:#c3a6f5; --new-soft:#2a2040;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0c161d; --surface:#13212b; --surface-2:#192a36; --text:#e6eef3; --muted:#9db1be;
  --line:#2a3d4a; --brand:#4fb3dc; --brand-2:#79c7e7; --brand-soft:#173444; --on-brand:#06212d;
  --tip-bg:#2b2410; --tip-line:#8a6d1c; --tip-text:#f2dc9a;
  --ok:#5fd08f; --ok-soft:#14321f; --warn:#f0b35a; --warn-soft:#33260f; --err:#ff8a80; --err-soft:#3a1715;
  --new:#c3a6f5; --new-soft:#2a2040; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--on-brand);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:44px}
header.top h1{font-size:18px;font-weight:650;margin:0;flex:1;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:var(--on-brand);border-radius:10px;min-height:40px;padding:0 12px;font-size:15px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .hbtn{border-color:rgba(0,0,0,.35)}
.net{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18)}
.net.off{background:#b3261e;color:#fff}
.progress{height:4px;background:rgba(255,255,255,.25);margin-top:8px}
.progress > i{display:block;height:100%;background:#fff;width:0;transition:width .2s}
main{padding:16px 0 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack > * + *{margin-top:12px}
h2{font-size:21px;margin:4px 0 2px;font-weight:700}
.sub{color:var(--muted);font-size:14.5px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:16px;cursor:pointer;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.q + .q{margin-top:12px}
.q.hidden{display:none}
.q.missing{border-color:var(--err);background:linear-gradient(var(--err-soft),var(--err-soft)) top/100% 4px no-repeat,var(--surface)}
.qlabel{display:block;font-weight:650;font-size:17px;margin:0 0 10px}
.qlabel .req{color:var(--err);margin-left:3px}
.tag.std{background:var(--brand-soft);color:var(--brand-2)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--new-soft);color:var(--new);vertical-align:2px;margin-left:6px}
.hint{color:var(--muted);font-size:14.5px;margin:-4px 0 10px}
.tip{background:var(--tip-bg);border-left:4px solid var(--tip-line);color:var(--tip-text);border-radius:8px;padding:10px 12px;font-size:14.5px;margin:0 0 12px}
.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.inp,select.inp,textarea.inp{width:100%;min-height:50px;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:17px}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.numwrap{display:flex;align-items:center;gap:10px}
.numwrap .inp{max-width:200px}
.unit{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:10px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:550;font-size:16px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip.multi[aria-pressed="true"]:not(.ranked)::before{content:"\2713  ";font-weight:800}
.chip .rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--on-brand);color:var(--brand);font-size:13px;font-weight:800;margin-right:8px}
.grid{width:100%;border-collapse:separate;border-spacing:0 8px}
.grid th{font-size:13px;color:var(--muted);font-weight:650;text-align:center;padding:0 4px}
.grid th.rowh{text-align:left}
.grid td{padding:0 4px;vertical-align:middle}
.grid td.rl{font-weight:600;font-size:15.5px;padding-right:8px;min-width:96px}
.grid .inp{min-height:46px;padding:8px;text-align:center}
.grid select.inp{text-align:left}
.gps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gps .btn{grid-column:1 / -1}
.gps small{grid-column:1 / -1;color:var(--muted)}
.computed{font-size:22px;font-weight:750;padding:8px 0;font-variant-numeric:tabular-nums}
.notebtn{margin-top:12px;background:none;border:none;color:var(--brand-2);font-weight:600;font-size:14.5px;padding:6px 0;cursor:pointer}
.notebox{margin-top:8px}
.notebox textarea{min-height:70px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.foot .row > .btn{flex:1}
.list .item{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.list .item + .item{margin-top:10px}
.item .meta{flex:1;min-width:0}
.item .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:14px}
.badge{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-draft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.b-pending{background:var(--warn-soft);color:var(--warn)}
.b-synced{background:var(--ok-soft);color:var(--ok)}
.b-error{background:var(--err-soft);color:var(--err)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,22,.5);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:80vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s}
.sheet.open{transform:none}
.sheet .sec{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;padding:13px 12px;border-radius:10px;border:none;background:none;font-size:16px;cursor:pointer}
.sheet .sec.cur{background:var(--brand-soft);font-weight:700}
.sheet .sec span:last-child{color:var(--muted);font-size:14px;white-space:nowrap}
.alert{border-radius:12px;padding:12px 14px;font-size:15px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.err{background:var(--err-soft);color:var(--err)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--brand-soft);color:var(--text)}
.rv h3{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rv dl{margin:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:6px 12px;font-size:14.5px}
.rv dt{color:var(--muted)}
.rv dd{margin:0;font-weight:600;word-break:break-word}
.rv dd.empty{color:var(--muted);font-weight:400}
.link{background:none;border:none;color:var(--brand-2);font-weight:650;cursor:pointer;font-size:14.5px;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f2330;color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
label.fl{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.filter .chip{min-height:38px;padding:6px 12px;font-size:14.5px}
@media (min-width:700px){
  body{font-size:18px}
  .q{padding:20px}
}
@media (max-width:420px){
  .grid td.rl{min-width:80px;font-size:14.5px}
  .grid .inp{padding:6px 4px;font-size:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="hbtn" id="hBack" hidden>Home</button>
    <h1 id="hTitle">GWC Community Assessment</h1>
    <span class="net" id="net">Online</span>
    <button class="hbtn" id="hMenu" hidden>Sections</button>
  </div>
  <div class="progress" id="prog" hidden><i></i></div>
</header>
<main><div class="wrap" id="view"></div></main>
<div class="foot" id="foot" hidden><div class="wrap"><div class="row" id="footRow"></div></div></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<!-- ===================== QUESTION SCHEMA ===================== -->
<!-- Edit questions here. "added" marks items that came from the field review comments. -->
<script id="schema">
(function(){
/* tag: 'new' = from field review, 'who' = WHO/UNICEF JMP standard question, 'cdc' = CDC safe water guidance */
const YN=['Yes','No'], YNU=['Yes','No','Unsure'], YND=['Yes','No',"Don't know"];
const has=(v,list)=>list.includes(v);
const PIPED=['Piped into home','Piped to yard or plot','Public tap or standpipe'];
const NATURAL=['River, stream, lake, or pond','Spring','Other'];
/* Drinking water sources: up to 3, in the order tapped. The first one is the main source. */
const srcs=d=>Array.isArray(d.primary_source)?d.primary_source:(d.primary_source?[d.primary_source]:[]);
const anySrc=(d,list)=>srcs(d).some(x=>list.includes(x));
const mainSrc=d=>srcs(d)[0];
const isWell=d=>anySrc(d,['Cistern or hand-dug well']);
const usesCistern=d=>isWell(d)||d.uses_cistern==='Yes';
const buys=d=>d.buys_water==='Yes'||d.buys_water==='Only in the dry season';
const num=(d,k)=>typeof d[k]==='number'?d[k]:0;
const USES=['Drinking','Cooking','Washing','Bathing','Livestock','Irrigation'];
const SOURCES=['Piped into home','Piped to yard or plot','Public tap or standpipe','Borehole or tubewell','Cistern or hand-dug well','Spring','Rainwater',
  'River, stream, lake, or pond','Tanker truck','Vendor cart','Water kiosk','Bottled or sachet water','Other'];
const SHALLOW=['Under 10 ft (3 m)','10 to 20 ft (3 to 6 m)','20 to 30 ft (6 to 9 m)','30 to 50 ft (9 to 15 m)','Over 50 ft (15 m)',"Don't know"];
const DEEP=['Under 50 ft (15 m)','50 to 100 ft (15 to 30 m)','100 to 200 ft (30 to 60 m)','200 to 300 ft (60 to 90 m)','Over 300 ft (90 m)',"Don't know"];
/* Monthly income bands per currency. KES bands are from the original form; the others are
   rounded equivalents. Edit the three break points for any currency here. */
const BANDS=window.GWC_INCOME_BANDS={KES:[5000,15000,30000],PEN:[150,400,800],NPR:[5000,15000,30000],USD:[40,120,240]};
const n=x=>x.toLocaleString('en-US');
const incomeOptions=d=>{const c=d.currency,b=BANDS[c];if(!b)return [];
  return [[0,b[0]],[b[0],b[1]],[b[1],b[2]],[b[2],null]].map(([a,z])=>({v:z==null?`${c} over ${n(a)}`:`${c} ${n(a)} to ${n(z)}`,a:a,b:z}));};

window.GWC_SCHEMA=[
{ id:'s0', title:'Community identification', questions:[
  {id:'language',label:'Interview language',type:'lang',required:true,tag:'new',hint:'The app switches to this language right away.'},
  {id:'community_name',label:'Community name',type:'text',required:true},
  {id:'country',label:'Country',type:'text',tag:'new'},
  {id:'currency',label:'Currency used in this community',type:'choice',options:['KES','PEN','NPR','USD','Other'],tag:'new',hint:'Sets the income and price questions.'},
  {id:'currency_other',label:'Currency code (3 letters, for example BDT)',type:'text',tag:'new',showIf:d=>d.currency==='Other'},
  {id:'fx_rate',label:'Exchange rate: how many {cur} equal 1 US dollar?',type:'number',tag:'new',showIf:d=>!!d.currency&&d.currency!=='USD',
    hint:'Filled in automatically. Change it if the local rate is different. Used to convert prices to US dollars.'},
  {id:'gps',label:'GPS location (decimal degrees)',type:'gps'},
  {id:'contact_name',label:'Main community contact: name',type:'text'},
  {id:'contact_phone',label:'Main community contact: phone',type:'tel'},
  {id:'contact_email',label:'Main community contact: email',type:'email'}
]},
{ id:'s1', title:'Interviewer and consent', questions:[
  {id:'interviewer_id',label:'Interviewer ID',type:'text',required:true,remember:true},
  {id:'interview_date',label:'Date of interview',type:'date'},
  {id:'start_time',label:'Start time',type:'time',hint:'Filled in when the assessment is created.'},
  {id:'end_time',label:'End time',type:'time',hint:'Filled in when you submit, if left blank.'},
  {id:'interviewer_email',label:'Interviewer email',type:'email',remember:true},
  {id:'interviewer_phone',label:'Interviewer phone',type:'tel',remember:true},
  {id:'entity_address',label:'Interviewing organization address',type:'textarea',remember:true},
  {id:'consent',label:'Has the person agreed to take part in this interview?',type:'choice',options:YN,required:true,tag:'new',
    hint:'Explain who you are, why you are asking, and that they can stop at any time.'}
]},
{ id:'s2', title:'Household', questions:[
  {id:'household_head',label:'Name of the head of household',type:'text'},
  {id:'respondent_role',label:'Who is answering the questions?',type:'choice',options:['Head of household','Spouse or partner','Other adult in the household'],tag:'new'},
  {id:'household_size',label:'How many people live in this household? Count adults and children.',type:'number',unit:'people'},
  {id:'children_0_12',label:'How many are children age 0 to 12?',type:'number',unit:'people',tag:'new'},
  {id:'children_under_5',label:'Of those children, how many are under age 5?',type:'number',unit:'people',showIf:d=>num(d,'children_0_12')>0},
  {id:'youth_13_22',label:'How many are age 13 to 22?',type:'number',unit:'people',tag:'new'},
  {id:'disability_count',label:'How many people in the household have a disability?',type:'number',unit:'people',tag:'new'},
  {id:'disability_types',label:'What kinds of disability? (select all that apply)',type:'multi',options:['Physical','Visual','Hearing','Intellectual','Other'],tag:'new',showIf:d=>num(d,'disability_count')>0},
  {id:'livelihood',label:'What is the household’s main way of earning a living?',type:'choice',options:['Farming','Herding','Trade','Salaried job','Day labor','None','Other']},
  {id:'crops_animals',label:'Does the household grow crops or raise animals?',type:'choice',options:YN},
  {id:'sells_produce',label:'Does the household sell any crops or animals?',type:'choice',options:YN,showIf:d=>d.crops_animals==='Yes'},
  {id:'income_band',label:'About how much money does the household earn in a typical month? ({cur})',type:'choice',options:incomeOptions,showIf:d=>d.currency!=='Other'},
  {id:'income_amount',label:'About how much money does the household earn in a typical month? ({cur})',type:'number',tag:'new',showIf:d=>d.currency==='Other'}
]},
{ id:'s3', title:'Drinking water source and access', questions:[
  {id:'primary_source',label:'Where does your drinking water come from? (up to 3)',type:'multi',max:3,ranked:true,options:SOURCES,tag:'who',hint:'Tap the main source first, then up to 2 others.'},
  {id:'primary_source_other',label:'Other source: describe it',type:'text',showIf:d=>anySrc(d,['Other'])},
  {id:'well_protected',label:'Is the well or spring protected? (covered, lined, with a raised edge so runoff cannot get in)',type:'choice',options:YND,tag:'who',
    showIf:d=>anySrc(d,['Cistern or hand-dug well','Spring'])},
  {id:'surface_distance_km',label:'How far is the river, lake, spring, or other natural source from your home?',type:'number',unit:'km',tag:'new',showIf:d=>anySrc(d,NATURAL)},
  {id:'uses_cistern',label:'Does your household use a cistern or hand-dug well for anything?',type:'choice',options:YN,tag:'new',
    showIf:d=>srcs(d).length>0&&!isWell(d),hint:'Cisterns and hand-dug wells are shallow wells, usually 10 to 30 feet (3 to 9 m) deep.'},
  {id:'cistern_depth',label:'How deep is the cistern or well?',type:'select',options:SHALLOW,tag:'new',showIf:usesCistern},
  {id:'cistern_uses',label:'What do you use the cistern or well water for?',type:'multi',options:USES,tag:'new',showIf:usesCistern},
  {id:'source_location',label:'Where is your main water source?',type:'choice',options:['In our home','In our yard or plot','Somewhere else'],tag:'who',
    showIf:d=>!!mainSrc(d)&&!['Piped into home','Piped to yard or plot','Bottled or sachet water'].includes(mainSrc(d))},
  {id:'piped_reliability',label:'How often does water come out of the tap?',type:'choice',options:['Always','Most of the time','Some of the time','Rarely'],tag:'who',showIf:d=>anySrc(d,PIPED)},
  {id:'collection_minutes',label:'How many minutes does one trip to get water take, there and back, including waiting in line?',type:'number',unit:'minutes',tag:'who',showIf:d=>d.source_location==='Somewhere else'},
  {id:'collector',label:'Who usually goes to get the water?',type:'choice',options:['Adult woman','Adult man','Girl under 15','Boy under 15'],tag:'who',showIf:d=>d.source_location==='Somewhere else'},
  {id:'collector_age',label:'How old is that person?',type:'number',unit:'years',showIf:d=>d.source_location==='Somewhere else'},
  {id:'water_sufficient',label:'In the last month, was there any time your household did not have enough drinking water?',type:'choice',options:['Yes, at least once','No, always enough',"Don't know"],tag:'who'},
  {id:'insufficient_reason',label:'What was the main reason?',type:'choice',options:['No water at the source','Too expensive','Could not get to the source','Other'],tag:'who',showIf:d=>d.water_sufficient==='Yes, at least once'},
  {id:'dry_season_change',label:'Does your main drinking water source change in the dry season?',type:'choice',options:YN,tag:'who'},
  {id:'dry_season_source',label:'What source do you use in the dry season?',type:'select',options:SOURCES,tag:'who',showIf:d=>d.dry_season_change==='Yes'},
  {id:'water_acceptable',label:'Is your drinking water acceptable to drink? (select all that apply)',type:'multi',options:['Acceptable','Bad taste','Bad color','Bad smell','Has dirt or particles'],tag:'who'}
]},
{ id:'s4', title:'Water use', questions:[
  {id:'transport_method',label:'How does your water get to your home? (up to 3)',type:'multi',max:3,ranked:true,hint:'Tap the main way first, then up to 2 others.',options:['Piped','Carried by hand','Wagon or cart','Vehicle','Delivered by vendor'],tag:'new'},
  {id:'containers',label:'On a typical day, how many 20 L containers does your household use for each of these?',type:'numgrid',rows:USES,cols:['Containers per day']},
  {id:'usage_confidence',label:'Interviewer: how confident are you in these numbers?',type:'choice',options:['Confident','Rough guess','Could not estimate'],tag:'new',
    hint:'Households that carry water usually know. Households with piped water usually do not.'},
  {id:'saves_water',label:'Does your household do anything to save water?',type:'choice',options:YN,tag:'new'},
  {id:'saves_water_how',label:'What do you do?',type:'text',tag:'new',showIf:d=>d.saves_water==='Yes'},

{ id:'s5', title:'Water storage and treatment', questions:[

{ id:'s6', title:'Toilets and handwashing', questions:[

  {id:'handwash_place',label:'Ask to see where people in the household most often wash their hands. What do you see?',type:'choice',tag:'who',

  {id:'handwash_water',label:'Is there water at the handwashing place right now?',type:'choice',options:['Water present','No water'],tag:'who',

  {id:'handwash_soap',label:'Is there soap at the handwashing place right now?',type:'choice',options:['Soap or detergent','Ash, mud, or sand only','Nothing'],tag:'who',
    showIf:d=>has(d.handwash_place,['Fixed place in the home','Fixed place in the yard','Bucket, jug, or kettle'])}
]},
{ id:'s7', title:'Buying water', questions:[
  {id:'buys_water',label:'Does your household buy water?',type:'choice',options:['Yes','No','Only in the dry season']},

  {id:'buy_freq',label:'How often do you buy water?',type:'choice',options:['Daily','Several times a week','Weekly','Occasionally'],showIf:buys},
  {id:'price_local',label:'How much do you pay for one 20 L container? ({cur})',type:'number',showIf:buys},
  {id:'price_usd',label:'Price for one 20 L container in US dollars',type:'computed',showIf:d=>buys(d)&&d.currency!=='USD',
    compute:d=>(typeof d.price_local==='number'&&typeof d.fx_rate==='number'&&d.fx_rate>0)?Math.round(d.price_local/d.fx_rate*100)/100:null,
    hint:'Calculated from the price and the exchange rate in Section 0.'},
  {id:'buy_week_spend',label:'About how much does your household spend on water in a typical week? ({cur})',type:'number',tag:'new',showIf:buys},
  {id:'buy_source',label:'Who do you buy it from? (select all that apply)',type:'multi',options:['Vendor cart','Water kiosk','Tanker truck','Neighbor','Shop (bottled water)','Other'],showIf:buys},
  {id:'buy_source_known',label:'Do you know where the seller gets the water?',type:'choice',options:YN,showIf:buys},
  {id:'buy_source_desc',label:'Where does it come from?',type:'text',showIf:d=>buys(d)&&d.buy_source_known==='Yes'},

    options:['Reverse osmosis (RO)','Basic filter','Chlorine','UV','Boiled','Not cleaned',"Don't know"],
    tip:'Unless the seller uses reverse osmosis (RO), the water will still carry nitrates and nitrites (usually from farming), heavy metals, and arsenic.'},
  {id:'vendor_tested',label:'Has the water you buy been tested?',type:'choice',options:YND,tag:'new',showIf:buys},

  {id:'buy_safe',label:'Do you think the water you buy is safe to drink without treating it?',type:'choice',options:YND,showIf:buys},
  {id:'buy_safe_judge',label:'How do you decide whether it is safe? (select all that apply)',type:'multi',tag:'new',showIf:buys,
    options:['Family does not get sick','Seller says it is safe','It has been tested','Taste, smell, or look',"Don't know"]},
  {id:'buy_affordable',label:'Is the price affordable for your household?',type:'choice',options:['Yes','No','Sometimes'],showIf:buys},
  {id:'cant_afford',label:'What do you do when you cannot afford water? (select all that apply)',type:'multi',options:['Use an unsafe source','Use less','Borrow money or water','Skip washing','Other'],showIf:buys}
]},
{ id:'s8', title:'Water-related illness', questions:[
  {id:'illness_cases',label:'How many times has someone in the household had each illness in the past...',type:'numgrid',
    rows:['Diarrhea','Typhoid','Cholera','Bilharzia','Scabies or other skin condition'],cols:['30 days','90 days','6 months','1 year'],
    hint:'Each column counts all cases in that period, so the 1 year count includes the 30 day cases.'},
  {id:'child_diarrhea_2wk',label:'In the last 2 weeks, has any child under 5 in this household had diarrhea?',type:'choice',options:YND,tag:'who',
    showIf:d=>num(d,'children_under_5')>0,hint:'Diarrhea means 3 or more loose or watery stools in one day.'},
  {id:'school_days_missed',label:'In the past 30 days, how many school days did children miss because of illness?',type:'number',unit:'days'},
  {id:'work_days_missed',label:'In the past 30 days, how many work days did adults miss because of illness?',type:'number',unit:'days'},
  {id:'treatment_sought',label:'Where did the household go for treatment? (select all that apply)',type:'multi',options:['Clinic','Hospital','Pharmacy','Community health worker','Traditional healer','Did not seek treatment']},
  {id:'caused_by_water',label:'Do you think your drinking water caused these illnesses?',type:'choice',options:YNU},
  {id:'community_sick',label:'Do people in this community, not only your household, get sick from their water?',type:'choice',options:['Often','Sometimes','Rarely','Never','Unsure'],tag:'new'}
]},

  {id:'road_condition',label:'What is the main road into the community like?',type:'choice',options:['Paved','Gravel','Dirt','Only usable in some seasons']},
  {id:'road_rainy',label:'Can vehicles use the roads in the rainy season?',type:'choice',options:['Yes','No','Partly']},
  {id:'roads_impassable_desc',label:'Which roads or paths become impassable?',type:'text',showIf:d=>has(d.road_rainy,['No','Partly'])},

  {id:'moto_access',label:'Can motorcycles reach homes and water points?',type:'choice',options:['Yes','No','Dry season only']},
  {id:'delivery_area',label:'Is there a central place where water could be delivered or unloaded?',type:'choice',options:['Yes','No','Would need to be created']},

  {id:'community_power',label:'Does the community have a shared power source?',type:'choice',options:YN},
  {id:'cooking_fuel',label:'What is the main cooking fuel?',type:'choice',options:['Firewood','Charcoal','LPG','Electricity','Other']}
]},
{ id:'s11', title:'Community water points and services', questions:[
  {id:'facilities_nearby',label:'Are there schools, clinics, or health centers nearby?',type:'choice',options:YN},
  {id:'facilities_desc',label:'Which ones, and how far away?',type:'textarea',showIf:d=>d.facilities_nearby==='Yes'},
  {id:'water_points',label:'Are there working boreholes, water tanks, or water kiosks in the community?',type:'choice',options:YN},
  {id:'water_points_count',label:'How many are there?',type:'number',tag:'new',showIf:d=>d.water_points==='Yes'},

{ id:'s12', title:'Priorities and contribution', questions:[

  {id:'travel_for_clean_km',label:'How far would you travel for clean drinking water? Distance one way',type:'number',unit:'km',tag:'new'}
]},
{ id:'s13', title:'Women, girls, and children', questions:[
  {id:'kids_miss_school',label:'How many school-age children regularly miss school because they collect water?',type:'number',unit:'people'},

<!-- ===================== APP ===================== -->
<script>
(function(){
'use strict';
/* ---- Supabase connection. Fill these in, or enter them on the Settings screen. ---- */
const SUPABASE_URL = '';        // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = '';   // Project Settings > API > anon public key
const SUPABASE_TABLE = 'gwc_assessments';

const APP_VERSION = '1.5.0';
const KEY_RECS = 'gwc_ca_records_v1', KEY_SET = 'gwc_ca_settings_v1';
const S = window.GWC_SCHEMA;
const I = window.GWC_I18N || {languages:[{code:'en',name:'English'}],ui:{en:{}},sections:{},q:{},opt:{en:{}}};
const QMAP = {}; S.forEach(s=>s.questions.forEach(q=>{QMAP[q.id]=q;q.section=s.id;}));

const $ = s=>document.querySelector(s);
const view = $('#view');
const esc = v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
const pad = n=>String(n).padStart(2,'0');
const today = ()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowHM = ()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtN = x=>Number(x).toLocaleString('en-US');

/* ---- storage ---- */
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){toast(t('storage_full'));return false;}}
let records = load(KEY_RECS,[]);
let settings = Object.assign({url:SUPABASE_URL,key:SUPABASE_ANON_KEY,table:SUPABASE_TABLE,theme:'auto',lang:'en',defaults:{},fx:{}}, load(KEY_SET,{}));
/* Exchange rates: local currency per 1 US dollar. Defaults are mid-market rates on Nov 3, 2026;
   the app refreshes them from ExchangeRate-API once a day when online. */
const DEFAULT_FX = {KES:129.9, PEN:3.47, NPR:151.84};
const FX_URL = 'https://open.er-api.com/v6/latest/USD';
function fxCode(d){return d.currency==='Other'?String(d.currency_other||'').trim().toUpperCase():d.currency;}
function fxFor(d){const c=fxCode(d);if(!c||c==='USD')return null;const r=(settings.fx&&settings.fx.rates)||{};return r[c]||DEFAULT_FX[c]||null;}
async function refreshFx(force){
  try{
    const last=settings.fx&&settings.fx.fetched_at?Date.parse(settings.fx.fetched_at):0;
    if(!force&&(!navigator.onLine||Date.now()-last<86400000))return false;
    const res=await fetch(FX_URL);const j=await res.json();
    if(j&&j.result==='success'&&j.rates){const keep=(settings.fx&&settings.fx.manual)||{};
      settings.fx={rates:Object.assign({},j.rates,keep),manual:keep,date:j.time_last_update_utc||'',fetched_at:new Date().toISOString(),source:'ExchangeRate-API'};saveSettings();return true;}
  }catch(e){}
  return false;
}
function saveRecords(){store(KEY_RECS,records);}
function saveSettings(){store(KEY_SET,settings);applyTheme();}
function applyTheme(){if(settings.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',settings.theme);}
applyTheme();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ---- state ---- */
let cur=null, secIdx=0, mode='home', homeFilter='open';
let saveTimer=null;
function touch(){ if(!cur)return; cur.updated_at=new Date().toISOString(); clearTimeout(saveTimer); saveTimer=setTimeout(saveRecords,250); }

/* ---- language ---- */
function lang(){return (cur&&cur.data.language)||settings.lang||'en';}
function t(k,vars){const L=lang();let s=(I.ui[L]&&I.ui[L][k])||(I.ui.en&&I.ui.en[k])||k;
  if(vars)s=s.replace(/\{(\w+)\}/g,(m,x)=>vars[x]!=null?vars[x]:m);return s;}
function curLabel(d){if(!d||!d.currency)return t('local_currency');if(d.currency==='Other')return d.currency_other||t('local_currency');return d.currency;}
function qText(q,f){const L=lang();const tr=I.q[L]&&I.q[L][q.id];const en={l:q.label,h:q.hint,t:q.tip,p:q.placeholder}[f];
  return String((tr&&tr[f])||en||'').replace('{cur}',curLabel(cur&&cur.data));}
function optT(v){const L=lang();return (I.opt[L]&&I.opt[L][v])||(I.opt.en&&I.opt.en[v])||v;}
function opts(q,d){const o=typeof q.options==='function'?q.options(d):(q.options||[]);
  return o.map(x=>typeof x==='string'?{v:x,label:optT(x)}:{v:x.v,label:x.b==null?t('over',{a:fmtN(x.a)}):t('range',{a:fmtN(x.a),b:fmtN(x.b)})});}
function secTitle(s){const L=lang();return (I.sections[L]&&I.sections[L][s.id])||s.title;}
function langName(c){const l=I.languages.find(x=>x.code===c);return l?l.name:c;}
function setDocLang(){document.documentElement.lang=lang();}

/* ---- helpers ---- */
const visible=(q,d)=>{try{return !q.showIf||!!q.showIf(d);}catch(e){return true;}};
function hasVal(v){
  if(v==null||v==='')return false;
  if(Array.isArray(v))return v.length>0;
  if(typeof v==='object')return Object.values(v).some(hasVal);
  return true;
}
function sectionCounts(s,d){let a=0,tt=0;s.questions.forEach(q=>{if(!visible(q,d))return;tt++;if(hasVal(d[q.id]))a++;});return {a,t:tt};}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('show'),2600);}
function recTitle(r){return r.data.community_name||t('untitled');}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso);const L=lang();
  try{return d.toLocaleDateString(L,{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString(L,{hour:'numeric',minute:'2-digit'});}
  catch(e){return d.toLocaleString();}}
function statusBadge(r){
  if(r.status==='synced')return `<span class="badge b-synced">${t('b_sent')}</span>`;
  if(r.status==='pending')return r.sync_error?`<span class="badge b-error">${t('b_error')}</span>`:`<span class="badge b-pending">${t('b_pending')}</span>`;
  return `<span class="badge b-draft">${t('b_draft')}</span>`;
}
function langChips(selected,attr){
  return `<div class="chips" role="radiogroup">${I.languages.map(l=>`<button type="button" class="chip" ${attr}="${l.code}" lang="${l.code}" aria-pressed="${selected===l.code}">${esc(l.name)}</button>`).join('')}</div>`;
}

/* ---- header ---- */
function header(opts){
  $('#hBack').hidden=!opts.back;$('#hMenu').hidden=!opts.menu;$('#prog').hidden=!opts.prog;$('#foot').hidden=!opts.foot;
  $('#hTitle').textContent=opts.title;$('#hBack').textContent=t('home');$('#hMenu').textContent=t('sections');updNet();setDocLang();
}

/* ---- network status ---- */
function updNet(){const n=$('#net');const on=navigator.onLine;n.textContent=on?t('online'):t('offline');n.classList.toggle('off',!on);}
window.addEventListener('online',()=>{updNet();syncAll(true);refreshFx(false);});
window.addEventListener('offline',updNet);

/* ====================== HOME ====================== */
function renderHome(){
  mode='home';cur=null;
  header({title:'GWC Community Assessment'});
  const c={draft:0,pending:0,synced:0};records.forEach(r=>c[r.status]++);
  const configured=!!(settings.url&&settings.key);
  let list=records.slice().sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''));
  if(homeFilter==='open')list=list.filter(r=>r.status!=='synced');
  else if(homeFilter==='synced')list=list.filter(r=>r.status==='synced');
  view.innerHTML=`
  <div class="stack">
    <div class="card"><div class="qlabel" style="margin-bottom:8px">${t('language')}</div>${langChips(settings.lang,'data-homelang')}</div>
    <button class="btn primary block" id="newBtn" style="min-height:58px;font-size:18px">${t('start_new')}</button>
    <div class="stats">
      <div class="stat"><div class="n">${c.draft}</div><div class="l">${t('drafts')}</div></div>
      <div class="stat"><div class="n">${c.pending}</div><div class="l">${t('waiting')}</div></div>
      <div class="stat"><div class="n">${c.synced}</div><div class="l">${t('sent')}</div></div>
    </div>
    ${!configured?`<div class="alert warn">${t('local_only')}</div>`:''}
    <div class="row">
      <button class="btn" id="syncBtn" ${c.pending&&configured?'':'disabled'}>${t('send_waiting',{n:c.pending})}</button>
      <button class="btn" id="setBtn">${t('settings')}</button>
    </div>
    <div>
      <div class="filter">
        <button class="chip" data-f="open" aria-pressed="${homeFilter==='open'}">${t('f_open')}</button>
        <button class="chip" data-f="synced" aria-pressed="${homeFilter==='synced'}">${t('f_sent')}</button>
        <button class="chip" data-f="all" aria-pressed="${homeFilter==='all'}">${t('f_all')}</button>
      </div>
      <div class="list">${list.length?list.map(r=>`
        <div class="item" data-open="${r.client_id}" role="button" tabindex="0">
          <div class="meta"><div class="t">${esc(r.data.community_name||t('untitled'))}${r.data.household_head?' · '+esc(r.data.household_head):''}</div>
          <div class="s">${esc(r.data.interview_date||'')} · ${esc(r.data.interviewer_id||t('no_interviewer'))} · ${esc(langName(r.data.language||'en'))} · ${esc(t('updated',{d:fmtDate(r.updated_at)}))}</div>
          ${r.sync_error?`<div class="s" style="color:var(--err)">${esc(r.sync_error)}</div>`:''}</div>
          ${statusBadge(r)}
        </div>`).join(''):`<p class="muted">${t('none_yet')}</p>`}
      </div>
    </div>
    <p class="muted small">${t('home_foot')}</p>
  </div>`;
  $('#newBtn').onclick=newRecord;
  $('#setBtn').onclick=renderSettings;
  $('#syncBtn').onclick=()=>syncAll(false);
  view.querySelectorAll('[data-homelang]').forEach(b=>b.onclick=()=>{settings.lang=b.dataset.homelang;saveSettings();renderHome();});
  view.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{homeFilter=b.dataset.f;renderHome();});
  view.querySelectorAll('[data-open]').forEach(el=>{
    const go=()=>{const r=records.find(x=>x.client_id===el.dataset.open);if(!r)return;cur=r;
      if(r.status==='synced'){renderReview();}else{secIdx=r.last_section||0;renderForm();}};
    el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go();};
  });
  window.scrollTo(0,0);
}

function newRecord(){
  const d={language:settings.lang||'en',interview_date:today(),start_time:nowHM()};
  const df=settings.defaults||{};
  S.forEach(s=>s.questions.forEach(q=>{if(q.remember&&df[q.id])d[q.id]=df[q.id];}));
  if(df.currency&&!d.currency)d.currency=df.currency;
  cur={client_id:uuid(),status:'draft',created_at:new Date().toISOString(),updated_at:new Date().toISOString(),data:d,notes:{},last_section:0};
  records.push(cur);saveRecords();secIdx=0;renderForm();
}

/* ====================== FORM ====================== */
function qHTML(q,r){
  const d=r.data,v=d[q.id],id=q.id;
  let h='';
  switch(q.type){
    case 'lang':
      h=langChips(v||'en','data-lang');break;
    case 'text':case 'tel':case 'email':
      h=`<input class="inp" type="${q.type}" id="f_${id}" data-q="${id}" value="${esc(v)}" placeholder="${esc(qText(q,'p'))}" ${q.type==='tel'?'inputmode="tel"':''} ${q.type==='email'?'inputmode="email" autocapitalize="off"':''} autocomplete="off">`;break;
    case 'date':case 'time':
      h=`<input class="inp" type="${q.type}" id="f_${id}" data-q="${id}" value="${esc(v)}" style="max-width:240px">`;break;
    case 'number':
      h=`<div class="numwrap"><input class="inp" type="number" inputmode="decimal" min="0" step="any" id="f_${id}" data-q="${id}" data-num="1" value="${esc(v)}">${q.unit?`<span class="unit">${esc(optT(q.unit))}</span>`:''}</div>`;break;
    case 'select':
      h=`<select class="inp" id="f_${id}" data-q="${id}"><option value="">${t('select')}</option>${opts(q,d).map(o=>`<option value="${esc(o.v)}" ${v===o.v?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;break;
    case 'computed':
      h=`<div class="computed" id="cv_${id}">${typeof v==='number'?'$'+v.toFixed(2):t('calc_wait')}</div>`;break;
    case 'textarea':
      h=`<textarea class="inp" id="f_${id}" data-q="${id}">${esc(v)}</textarea>`;break;
    case 'choice':{
      const o=opts(q,d);
      h=o.length?`<div class="chips" role="radiogroup">${o.map(x=>`<button type="button" class="chip" data-chip="${id}" data-v="${esc(x.v)}" aria-pressed="${v===x.v}">${esc(x.label)}</button>`).join('')}</div>`
        :(id==='income_band'?`<p class="hint" style="margin:0">${t('pick_currency')}</p>`:'');break;}
    case 'multi':{
      const arr=Array.isArray(v)?v:[];
      h=`<div class="chips">${opts(q,d).map(x=>{const k=arr.indexOf(x.v);return `<button type="button" class="chip multi${q.ranked?' ranked':''}" data-multi="${id}" data-v="${esc(x.v)}" aria-pressed="${k>=0}">${q.ranked&&k>=0?`<span class="rank">${k+1}</span>`:''}${esc(x.label)}</button>`;}).join('')}</div>`;break;}
    case 'gps':{
      const g=v||{};
      h=`<div class="gps">
        <input class="inp" type="number" step="any" inputmode="decimal" placeholder="${t('lat')}" data-q="${id}" data-k="lat" data-num="1" value="${esc(g.lat)}" aria-label="${t('lat')}">
        <input class="inp" type="number" step="any" inputmode="decimal" placeholder="${t('lng')}" data-q="${id}" data-k="lng" data-num="1" value="${esc(g.lng)}" aria-label="${t('lng')}">
        <button type="button" class="btn" data-gps="${id}">${t('gps_btn')}</button>
        <small id="gpsmsg_${id}">${g.acc?t('gps_acc',{m:Math.round(g.acc)}):''}</small></div>`;break;}
    case 'numgrid':{
      const g=v||{};const one=q.cols.length===1;
      h=`<table class="grid"><thead><tr><th class="rowh"></th>${q.cols.map(c=>`<th>${esc(optT(c))}</th>`).join('')}</tr></thead><tbody>${
        q.rows.map(rw=>{const rk=slug(rw);return `<tr><td class="rl">${esc(optT(rw))}</td>${q.cols.map(c=>{const ck=slug(c);
          const val=one?g[rk]:(g[rk]||{})[ck];
          return `<td><input class="inp" type="number" inputmode="decimal" min="0" step="any" data-q="${id}" data-r="${rk}" ${one?'':`data-c="${ck}"`} data-num="1" value="${esc(val)}" aria-label="${esc(optT(rw)+' '+optT(c))}"></td>`;}).join('')}</tr>`;}).join('')
      }</tbody></table>`;break;}
    case 'selectgrid':{
      const g=v||{};
      h=`<table class="grid"><tbody>${q.rows.map(rw=>{const rk=slug(rw);return `<tr><td class="rl">${esc(optT(rw))}</td><td><select class="inp" data-q="${id}" data-r="${rk}" aria-label="${esc(optT(rw))}"><option value="">${t('select')}</option>${opts(q,d).map(o=>`<option value="${esc(o.v)}" ${g[rk]===o.v?'selected':''}>${esc(o.label)}</option>`).join('')}</select></td></tr>`;}).join('')}</tbody></table>`;break;}
  }
  const note=r.notes[id]||'';const hint=qText(q,'h'),tip=qText(q,'t');
  return `<div class="q ${visible(q,d)?'':'hidden'}" data-qid="${id}">
    <label class="qlabel" ${['choice','multi','numgrid','selectgrid','gps','lang','computed'].includes(q.type)?'':`for="f_${id}"`}>${esc(qText(q,'l'))}${q.required?'<span class="req">*</span>':''}${q.tag==='new'?`<span class="tag">${t('new_tag')}</span>`:q.tag?`<span class="tag std">${q.tag.toUpperCase()}</span>`:''}</label>
    ${hint?`<p class="hint">${esc(hint)}</p>`:''}
    ${tip?`<div class="tip"><b>${t('tip')}</b>${esc(tip)}</div>`:''}
    ${h}
    ${q.type==='lang'?'':`<button type="button" class="notebtn" data-note="${id}">${note?t('edit_note'):t('add_note')}</button>
    <div class="notebox" id="nb_${id}" ${note?'':'hidden'}><textarea class="inp" data-notefield="${id}" placeholder="${t('note_ph')}">${esc(note)}</textarea></div>`}
  </div>`;
}

/* Questions whose change alters other questions' wording or choices on the same screen */
const RERENDER=['currency'];
function recompute(){S.forEach(s=>s.questions.forEach(q=>{if(q.type!=='computed')return;const v=q.compute(cur.data);
  if(v==null)delete cur.data[q.id];else cur.data[q.id]=v;const el=document.getElementById('cv_'+q.id);if(el)el.textContent=v==null?t('calc_wait'):'$'+v.toFixed(2);}));}
function setVal(qid,val){
  if(val===''||val==null||(Array.isArray(val)&&!val.length))delete cur.data[qid];else cur.data[qid]=val;
  if(qid==='currency'){const b=cur.data.income_band;if(b&&!String(b).startsWith(String(val)+' '))delete cur.data.income_band;}
  if(qid==='currency'||qid==='currency_other'){const r=fxFor(cur.data);if(r)cur.data.fx_rate=r;else if(qid==='currency')delete cur.data.fx_rate;
    const fi=view.querySelector('[data-q="fx_rate"]');if(fi)fi.value=cur.data.fx_rate!=null?cur.data.fx_rate:'';}
  recompute();
  touch();refreshVis();
}
function refreshVis(){
  view.querySelectorAll('.q[data-qid]').forEach(el=>{const q=QMAP[el.dataset.qid];el.classList.toggle('hidden',!visible(q,cur.data));});
  showWarnings();
}
function warnings(d){
  const w=[];const n=k=>typeof d[k]==='number'?d[k]:null;
  if(d.consent==='No')w.push(['s1','w_consent']);
  if(n('children_under_5')!=null&&n('children_0_12')!=null&&n('children_under_5')>n('children_0_12'))w.push(['s2','w_u5']);
  if(n('household_size')!=null&&(n('children_0_12')||0)+(n('youth_13_22')||0)>n('household_size'))w.push(['s2','w_kids']);
  if(n('household_size')!=null&&n('disability_count')!=null&&n('disability_count')>n('household_size'))w.push(['s2','w_dis']);
  if(n('collector_age')!=null&&n('collector_age')>110)w.push(['s3','w_age']);
  const g=d.gps;if(g&&((g.lat!=null&&Math.abs(g.lat)>90)||(g.lng!=null&&Math.abs(g.lng)>180)))w.push(['s0','w_gps']);
  return w;
}
function showWarnings(){
  const box=$('#secWarn');if(!box)return;
  const w=warnings(cur.data).filter(x=>x[0]===S[secIdx].id).map(x=>t(x[1]));
  box.innerHTML=w.map(x=>`<div class="alert warn" style="margin-top:8px">${esc(x)}</div>`).join('');
}
function bindForm(){
  const qs=$('#qs');
  qs.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.notefield){const id=el.dataset.notefield;if(el.value.trim())cur.notes[id]=el.value;else delete cur.notes[id];touch();return;}
    const qid=el.dataset.q;if(!qid)return;
    let val=el.value;
    if(el.dataset.num){val=val===''?'':Number(val);if(Number.isNaN(val))val='';}
    if(el.dataset.k){const o=Object.assign({},cur.data[qid]||{});if(val==='')delete o[el.dataset.k];else o[el.dataset.k]=val;delete o.acc;setVal(qid,Object.keys(o).length?o:'');return;}
    if(el.dataset.r){
      const o=JSON.parse(JSON.stringify(cur.data[qid]||{}));const r=el.dataset.r,c=el.dataset.c;
      if(c){o[r]=o[r]||{};if(val==='')delete o[r][c];else o[r][c]=val;if(!Object.keys(o[r]).length)delete o[r];}
      else{if(val==='')delete o[r];else o[r]=val;}
      setVal(qid,Object.keys(o).length?o:'');return;
    }
    setVal(qid,val);
  });
  qs.addEventListener('change',e=>{
    if(e.target.tagName==='SELECT')e.target.dispatchEvent(new Event('input',{bubbles:true}));
    if(RERENDER.includes(e.target.dataset.q))renderForm(true);
  });
  qs.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.lang){cur.data.language=b.dataset.lang;settings.lang=b.dataset.lang;saveSettings();touch();saveRecords();renderForm(true);}
    else if(b.dataset.chip){const id=b.dataset.chip,v=b.dataset.v;const nv=cur.data[id]===v?'':v;
      b.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===nv)));setVal(id,nv);
      if(RERENDER.includes(id))renderForm(true);}
    else if(b.dataset.multi){const id=b.dataset.multi,v=b.dataset.v;let arr=Array.isArray(cur.data[id])?cur.data[id].slice():[];
      const exclusive=['None',"Don't know",'Acceptable','No','Did not seek treatment'];
      const mq=QMAP[id];
      if(arr.includes(v))arr=arr.filter(x=>x!==v);else{ if(exclusive.includes(v))arr=[v];else{arr=arr.filter(x=>!exclusive.includes(x));if(mq.max&&arr.length>=mq.max){toast(t('max_reached',{n:mq.max}));return;}arr.push(v);} }
      setVal(id,arr);
      if(mq.ranked){renderForm(true);}else b.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(arr.includes(c.dataset.v))));}
    else if(b.dataset.note){const box=$('#nb_'+b.dataset.note);box.hidden=false;box.querySelector('textarea').focus();}
    else if(b.dataset.gps){captureGPS(b.dataset.gps,b);}
  });
}
function captureGPS(id,btn){
  const msg=$('#gpsmsg_'+id);
  if(!navigator.geolocation){msg.textContent=t('gps_none');return;}
  btn.disabled=true;btn.textContent=t('gps_finding');msg.textContent=t('gps_wait');
  navigator.geolocation.getCurrentPosition(p=>{
    const o={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:p.coords.accuracy};
    cur.data[id]=o;touch();
    const ins=view.querySelectorAll(`[data-q="${id}"]`);ins[0].value=o.lat;ins[1].value=o.lng;
    msg.textContent=t('gps_ok',{m:Math.round(o.acc)});btn.disabled=false;btn.textContent=t('gps_btn');showWarnings();
  },err=>{
    msg.textContent=err.code===1?t('gps_denied'):t('gps_fail');
    btn.disabled=false;btn.textContent=t('gps_btn');
  },{enableHighAccuracy:true,timeout:60000,maximumAge:0});
}

/* ====================== REVIEW ====================== */
function fmtAnswer(q,v,d){
  if(!hasVal(v))return null;
  switch(q.type){
    case 'lang':return langName(v);
    case 'choice':case 'select':{const o=opts(q,d).find(x=>x.v===v);return o?o.label:optT(v);}
    case 'multi':return q.ranked?v.map((x,i)=>`${i+1}. ${optT(x)}`).join(', '):v.map(optT).join(', ');
    case 'gps':return [v.lat,v.lng].filter(x=>x!=null).join(', ')+(v.acc?` (±${Math.round(v.acc)} m)`:'');
    case 'numgrid':{const one=q.cols.length===1;return q.rows.map(rw=>{const rk=slug(rw);const x=v[rk];if(x==null)return null;
      if(one)return `${optT(rw)}: ${x}`;const parts=q.cols.map(c=>x[slug(c)]!=null?`${optT(c)} ${x[slug(c)]}`:null).filter(Boolean);return parts.length?`${optT(rw)}: ${parts.join(', ')}`:null;}).filter(Boolean).join('; ');}
    case 'selectgrid':return q.rows.map(rw=>v[slug(rw)]?`${optT(rw)}: ${optT(v[slug(rw)])}`:null).filter(Boolean).join('; ');
    case 'computed':return '$'+Number(v).toFixed(2);
    case 'number':return q.unit?`${v} ${optT(q.unit)}`:String(v);
    default:return String(v);
  }
}
function missingRequired(d){const m=[];S.forEach(s=>s.questions.forEach(q=>{if(q.required&&visible(q,d)&&!hasVal(d[q.id]))m.push(q);}));return m;}
function renderReview(){
  mode='review';
  const ro=cur.status==='synced';
  header({back:true,menu:!ro,foot:true,title:recTitle(cur)});
  const d=cur.data,miss=missingRequired(d),w=warnings(d).map(x=>t(x[1]));
  view.innerHTML=`<div class="stack">
    <div><h2>${ro?t('sent_title'):t('review_submit')}</h2>
    <p class="sub">${ro?esc(t('sent_ro',{d:fmtDate(cur.synced_at)})):t('review_help')}</p></div>
    ${miss.length?`<div class="alert err">${esc(t('required',{list:miss.map(q=>qText(q,'l')).join(', ')}))}</div>`:''}
    ${w.map(x=>`<div class="alert warn">${esc(x)}</div>`).join('')}
    ${cur.sync_error?`<div class="alert err">${esc(t('last_fail',{e:cur.sync_error}))}</div>`:''}
    ${S.map((s,i)=>{const items=s.questions.filter(q=>visible(q,d));
      return `<div class="card rv"><h3><span>${i}. ${esc(secTitle(s))}</span>${ro?'':`<button class="link" data-edit="${i}">${t('edit')}</button>`}</h3><dl>${
        items.map(q=>{const a=fmtAnswer(q,d[q.id],d);const nt=cur.notes[q.id];
          return `<dt>${esc(qText(q,'l'))}</dt><dd class="${a?'':'empty'}">${a?esc(a):t('no_answer')}${nt?`<div class="muted small" style="font-weight:400;margin-top:2px">${t('note')}: ${esc(nt)}</div>`:''}</dd>`;}).join('')
      }</dl></div>`;}).join('')}
  </div>`;
  if(ro){
    $('#footRow').innerHTML=`<button class="btn" id="homeBtn">${t('back_list')}</button>`;
    $('#homeBtn').onclick=renderHome;
  }else{
    $('#footRow').innerHTML=`<button class="btn" id="discBtn">${cur.status==='draft'?t('discard'):t('keep_editing')}</button>
      <button class="btn primary" id="subBtn" ${miss.length?'disabled':''}>${cur.status==='pending'?t('save_send'):t('submit')}</button>`;
    $('#discBtn').onclick=()=>{
      if(cur.status!=='draft'){secIdx=0;renderForm();return;}
      if(confirm(t('confirm_discard'))){records=records.filter(r=>r!==cur);saveRecords();const m=t('discarded');renderHome();toast(m);}
    };
    $('#subBtn').onclick=submitCurrent;
    view.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{secIdx=+b.dataset.edit;renderForm();});
  }
  window.scrollTo(0,0);
}
function submitCurrent(){
  if(!cur.data.end_time)cur.data.end_time=nowHM();
  cur.status='pending';cur.submitted_at=new Date().toISOString();cur.sync_error=null;
  const df=settings.defaults||{};S.forEach(s=>s.questions.forEach(q=>{if(q.remember&&cur.data[q.id])df[q.id]=cur.data[q.id];}));
  if(cur.data.currency)df.currency=cur.data.currency;
  settings.defaults=df;saveSettings();saveRecords();
  const m=navigator.onLine&&settings.url?t('submitted_sending'):t('submitted_later');
  renderHome();toast(m);syncAll(true);
}

/* ====================== SYNC ====================== */
function cleanData(d){const o={};Object.keys(d).forEach(k=>{const q=QMAP[k];if(q&&!visible(q,d))return;if(hasVal(d[k]))o[k]=d[k];});return o;}
function payload(r){
  const d=cleanData(r.data);const g=d.gps||{};
  const notes={};Object.keys(r.notes||{}).forEach(k=>{if(!QMAP[k]||visible(QMAP[k],r.data))notes[k]=r.notes[k];});
  return {
    client_id:r.client_id, app_version:APP_VERSION,
    community_name:d.community_name||null, country:d.country||null,
    gps_lat:typeof g.lat==='number'?g.lat:null, gps_lng:typeof g.lng==='number'?g.lng:null, gps_accuracy_m:typeof g.acc==='number'?g.acc:null,
    interviewer_id:d.interviewer_id||null, interview_date:/^\d{4}-\d{2}-\d{2}$/.test(d.interview_date||'')?d.interview_date:null,
    household_head:d.household_head||null,
    device_created_at:r.created_at, device_submitted_at:r.submitted_at||null,
    responses:d, interviewer_notes:notes
  };
}
let syncing=false;
async function syncAll(quiet){
  if(syncing)return;
  const pend=records.filter(r=>r.status==='pending');
  if(!pend.length)return;
  if(!settings.url||!settings.key){if(!quiet)toast(t('need_settings'));return;}
  if(!navigator.onLine){if(!quiet)toast(t('no_conn'));return;}
  syncing=true;let ok=0,fail=0;
  const base=settings.url.replace(/\/+$/,'');
  for(const r of pend){
    try{
      const res=await fetch(`${base}/rest/v1/${encodeURIComponent(settings.table||SUPABASE_TABLE)}`,{
        method:'POST',
        headers:{'apikey':settings.key,'Authorization':'Bearer '+settings.key,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(payload(r))
      });
      if(res.ok||res.status===409){/* 409 = this record already arrived on an earlier attempt */r.status='synced';r.synced_at=new Date().toISOString();r.sync_error=null;ok++;}
      else{const tx=await res.text();let m=tx;try{m=JSON.parse(tx).message||tx;}catch(e){}r.sync_error=t('server_said',{s:res.status+': '+String(m).slice(0,160)});fail++;}
    }catch(e){r.sync_error=t('unreachable');fail++;}
  }
  syncing=false;saveRecords();
  if(mode==='home')renderHome();
  if(ok||!quiet||fail)toast(ok&&!fail?t('sent_n',{n:ok}):t('partial',{ok:ok,fail:fail}));
}
setInterval(()=>{if(navigator.onLine)syncAll(true);},120000);

      <h2 style="font-size:18px">${t('fx_title')}</h2>
      <p class="sub">${settings.fx&&settings.fx.date?esc(t('fx_updated',{d:settings.fx.date})):t('fx_default')}</p>
      ${['KES','PEN','NPR'].map(c=>`<label class="fl" for="fx_${c}">${optT(c)}</label><input class="inp" type="number" step="any" inputmode="decimal" id="fx_${c}" data-fx="${c}" value="${esc(((settings.fx&&settings.fx.rates)||{})[c]||DEFAULT_FX[c])}" style="max-width:220px">`).join('')}
      <div class="row" style="margin-top:14px"><button class="btn" id="fxSave">${t('save')}</button><button class="btn" id="fxNow">${t('fx_update')}</button></div>
      <div id="fxMsg" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2 style="font-size:18px">${t('display')}</h2>
      <div class="chips" style="margin-top:10px">${['auto','light','dark'].map(x=>`<button class="chip" data-theme-opt="${x}" aria-pressed="${settings.theme===x}">${t('th_'+x)}</button>`).join('')}</div>
    </div>
    <div class="card">
      <h2 style="font-size:18px">${t('backup')}</h2>
      <p class="sub">${t('backup_help')}</p>
      <div class="row" style="margin-top:12px"><button class="btn" id="sCsv">${t('dl_csv')}</button><button class="btn" id="sJson">${t('dl_json')}</button></div>
    </div>
    <p class="muted small">${esc(t('version',{v:APP_VERSION,n:records.length}))}</p>
  </div>`;
  const read=()=>{settings.url=$('#sUrl').value.trim();settings.key=$('#sKey').value.trim();settings.table=$('#sTbl').value.trim()||SUPABASE_TABLE;};
  $('#sSave').onclick=()=>{read();saveSettings();toast(t('saved'));syncAll(true);};
  $('#sTest').onclick=async()=>{
    read();const m=$('#sMsg');
    if(!settings.url||!settings.key){m.innerHTML=`<div class="alert err">${t('t_need')}</div>`;return;}
    m.innerHTML=`<div class="alert info">${t('testing')}</div>`;
    try{
      const res=await fetch(`${settings.url.replace(/\/+$/,'')}/rest/v1/${encodeURIComponent(settings.table)}`,{method:'POST',
        headers:{'apikey':settings.key,'Authorization':'Bearer '+settings.key,'Content-Type':'application/json','Prefer':'return=minimal'},body:'[]'});
      if(res.ok){m.innerHTML=`<div class="alert ok">${t('t_ok')}</div>`;saveSettings();}
      else{const tx=await res.text();m.innerHTML=`<div class="alert err">${esc(t('t_fail',{s:res.status}))} ${esc(tx.slice(0,200))}</div>`;}
    }catch(e){m.innerHTML=`<div class="alert err">${t('t_unreach')}</div>`;}
  };
  view.querySelectorAll('[data-theme-opt]').forEach(b=>b.onclick=()=>{settings.theme=b.dataset.themeOpt;saveSettings();renderSettings();});
  $('#fxSave').onclick=()=>{settings.fx=settings.fx||{};settings.fx.rates=settings.fx.rates||{};settings.fx.manual=settings.fx.manual||{};
    view.querySelectorAll('[data-fx]').forEach(i=>{const v=Number(i.value);if(v>0){const c=i.dataset.fx;const def=((settings.fx.rates[c])||DEFAULT_FX[c]);
      if(v!==def){settings.fx.manual[c]=v;}settings.fx.rates[c]=v;}});saveSettings();toast(t('saved'));};
  $('#fxNow').onclick=async()=>{const m=$('#fxMsg');m.innerHTML=`<div class="alert info">${t('testing')}</div>`;
    if(settings.fx)settings.fx.manual={};const ok=await refreshFx(true);
    if(ok)renderSettings();else m.innerHTML=`<div class="alert err">${t('fx_fail')}</div>`;};
  $('#sCsv').onclick=exportCSV;
  $('#sJson').onclick=()=>download('gwc-assessments-'+today()+'.json',JSON.stringify(records,null,2),'application/json');
  window.scrollTo(0,0);
}

/* ---- export (always English column names and values) ---- */
function columns(){
  const cols=[];
  S.forEach(s=>s.questions.forEach(q=>{
    if(q.type==='gps'){cols.push({k:q.id+'_lat',f:d=>(d[q.id]||{}).lat});cols.push({k:q.id+'_lng',f:d=>(d[q.id]||{}).lng});}
    else if(q.type==='numgrid'){const one=q.cols.length===1;q.rows.forEach(rw=>{const rk=slug(rw);
      if(one)cols.push({k:`${q.id}__${rk}`,f:d=>(d[q.id]||{})[rk]});
      else q.cols.forEach(c=>{const ck=slug(c);cols.push({k:`${q.id}__${rk}__${ck}`,f:d=>((d[q.id]||{})[rk]||{})[ck]});});});}
    else if(q.type==='selectgrid'){q.rows.forEach(rw=>{const rk=slug(rw);cols.push({k:`${q.id}__${rk}`,f:d=>(d[q.id]||{})[rk]});});}
    else if(q.type==='multi')cols.push({k:q.id,f:d=>Array.isArray(d[q.id])?d[q.id].join('; '):''});
    else cols.push({k:q.id,f:d=>d[q.id]});
  }));
  return cols;
}
function exportCSV(){
  const cols=columns();
  const cell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['client_id','status','created_at','submitted_at','synced_at',...cols.map(c=>c.k),'interviewer_notes'];
  const lines=[head.join(',')];
  records.forEach(r=>{const d=cleanData(r.data);
    lines.push([r.client_id,r.status,r.created_at,r.submitted_at,r.synced_at,...cols.map(c=>c.f(d)),
      Object.entries(r.notes||{}).map(([k,v])=>`${k}: ${v}`).join(' | ')].map(cell).join(','));});
  download('gwc-assessments-'+today()+'.csv','﻿'+lines.join('\r\n'),'text/csv');
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ---- offline app shell ---- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
renderHome();
syncAll(true);
refreshFx(false);
})();
</script>
